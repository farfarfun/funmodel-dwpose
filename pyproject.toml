[project]
name = "funmodel-dwpose"
version = "0.0.12"
description = "funmodel-dwpose"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "funmodel",
    "fundrive[oss]>=2.0",
    "funget>=1.1",
    "opencv-python>=4.6",
    "matplotlib>=3.5",
    "numpy>=1.23",
    "onnxruntime>=1.14",
    "torch>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funmodel"]
